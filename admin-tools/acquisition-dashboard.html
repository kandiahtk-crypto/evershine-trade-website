<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Outbound Acquisition Dashboard</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  margin: 0;
  background: #f4f6fa;
  padding: 40px;
  color: #1a2433;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.06);
}

h1 {
  margin-top: 0;
  font-size: 28px;
}

label {
  display: block;
  margin-top: 20px;
  font-weight: 600;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ddd;
  font-size: 14px;
}

button {
  margin-top: 25px;
  padding: 14px;
  width: 100%;
  border-radius: 6px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  background: #2e5fa7;
  color: white;
}

.lead-card {
  margin-top: 30px;
  padding: 20px;
  border-radius: 8px;
  border: 1px solid #e6ecf4;
  background: #fafbfe;
}

.badge {
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 12px;
  color: white;
  display: inline-block;
  margin-top: 8px;
}

.stage-select {
  margin-top: 10px;
}

.email-box {
  margin-top: 15px;
  background: #fff;
  padding: 15px;
  border-radius: 6px;
  border: 1px solid #ddd;
  font-size: 13px;
  white-space: pre-wrap;
}

.small-btn {
  margin-top: 10px;
  width: auto;
  padding: 8px 14px;
  font-size: 12px;
  background: #444;
}
</style>
</head>

<body>

<div class="container">

<h1>Outbound Acquisition Engine</h1>

<label>Company Name</label>
<input type="text" id="company">

<label>Market</label>
<select id="market">
  <option value="USA">USA</option>
  <option value="Europe">Europe</option>
  <option value="China">China</option>
  <option value="India">India</option>
</select>

<label>Estimated Annual UK Departures</label>
<input type="number" id="volume">

<button onclick="addLead()">Add Lead</button>

<div id="leadList"></div>

</div>

<script>

let operators = [];

/* Load saved leads */
window.onload = function() {
  const saved = localStorage.getItem("operators");
  if (saved) {
    operators = JSON.parse(saved);
    renderLeads();
  }
};

function saveData() {
  localStorage.setItem("operators", JSON.stringify(operators));
}

function addLead() {

  const company = document.getElementById("company").value;
  const market = document.getElementById("market").value;
  const volume = parseInt(document.getElementById("volume").value) || 0;

  let tier = "";
  if (volume >= 40) tier = "Tier 1 – High Value";
  else if (volume >= 15) tier = "Tier 2 – Growth";
  else tier = "Tier 3 – Low Volume";

  operators.push({
    company,
    market,
    volume,
    tier,
    stage: "Cold"
  });

  saveData();
  renderLeads();
}

function deleteLead(index) {
  operators.splice(index, 1);
  saveData();
  renderLeads();
}

function updateStage(index, value) {
  operators[index].stage = value;
  saveData();
}

function generateEmail(company, market) {

  if (market === "USA") {
    return `Subject: UK 2026 Series Allocation Planning

Hi ${company} Team,

We support US tour operators delivering structured UK multi-day touring programmes,
with controlled fleet allocation during peak Scotland and Heathrow-based departures.

If you're planning 2026 series capacity, I would welcome a brief discussion.

Kind regards`;
  }

  if (market === "China") {
    return `Subject: Structured UK Touring Support

Dear ${company},

We support high-density UK touring programmes with structured fleet allocation,
timing discipline and Scotland routing control.

If you are reviewing UK ground transport partners, I would welcome a conversation.

Kind regards`;
  }

  if (market === "India") {
    return `Subject: UK Premium Group Touring Support

Hello ${company},

We provide structured UK ground transport for premium group touring,
multi-city circuits and seasonal block departures.

If UK capacity planning is underway, I would be pleased to connect.

Best regards`;
  }

  return `Subject: UK Touring Capacity Support

Hello ${company},

We support structured UK touring programmes for European operators,
with defined fleet allocation and operational clarity.

Kind regards`;
}

function copyEmail(text) {
  navigator.clipboard.writeText(text);
  alert("Email copied to clipboard.");
}

function renderLeads() {

  const list = document.getElementById("leadList");
  list.innerHTML = "";

  operators.forEach((op, index) => {

    let badgeColor = op.tier.includes("Tier 1") ? "red" :
                     op.tier.includes("Tier 2") ? "orange" : "green";

    const emailText = generateEmail(op.company, op.market);

    list.innerHTML += `
      <div class="lead-card">
        <strong>${op.company}</strong><br>
        Market: ${op.market}<br>
        Volume: ${op.volume}<br>

        <div class="badge" style="background:${badgeColor}">
          ${op.tier}
        </div>

        <div class="stage-select">
          Stage:
          <select onchange="updateStage(${index}, this.value)">
            <option ${op.stage==="Cold"?"selected":""}>Cold</option>
            <option ${op.stage==="Contacted"?"selected":""}>Contacted</option>
            <option ${op.stage==="Call Booked"?"selected":""}>Call Booked</option>
            <option ${op.stage==="Proposal Sent"?"selected":""}>Proposal Sent</option>
            <option ${op.stage==="Won"?"selected":""}>Won</option>
          </select>
        </div>

        <div class="email-box">${emailText}</div>

        <button class="small-btn" onclick="copyEmail(\`${emailText}\`)">
          Copy Outreach Email
        </button>

        <button class="small-btn" onclick="deleteLead(${index})">
          Delete Lead
        </button>

      </div>
    `;
  });
}

</script>

</body>
</html>
