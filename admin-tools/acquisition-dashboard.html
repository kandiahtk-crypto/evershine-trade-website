<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Outbound Acquisition Dashboard</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 1200px;
  margin: auto;
  background: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.05);
}

h1 {
  margin-top: 0;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 1px solid #ddd;
}

button {
  padding: 12px;
  background: #2e5fa7;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 30px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

.badge {
  padding: 5px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
}

.high { background: #d9534f; }
.medium { background: #f0ad4e; }
.low { background: #5cb85c; }

</style>
</head>

<body>

<div class="container">
<h1>Outbound Operator Acquisition System</h1>

<h3>Add New Operator</h3>

<label>Company Name</label>
<input type="text" id="company">

<label>Country / Market</label>
<select id="market">
  <option value="USA">USA</option>
  <option value="Europe">Europe</option>
  <option value="India">India</option>
  <option value="China">China</option>
</select>

<label>Estimated Annual UK Departures</label>
<input type="number" id="departures">

<label>Includes Scotland Routing?</label>
<select id="scotland">
  <option value="yes">Yes</option>
  <option value="no">No</option>
</select>

<label>Contact Name</label>
<input type="text" id="contact">

<label>Email</label>
<input type="text" id="email">

<button onclick="addOperator()">Add Operator</button>

<h3>Pipeline</h3>

<table>
<thead>
<tr>
<th>Company</th>
<th>Market</th>
<th>Departures</th>
<th>Scotland</th>
<th>Priority</th>
<th>Status</th>
</tr>
</thead>
<tbody id="tableBody"></tbody>
</table>

</div>

<script>

let operators = JSON.parse(localStorage.getItem("operators")) || [];

function calculatePriority(departures, scotland) {
  let score = 0;

  if (departures >= 10) score += 2;
  if (departures >= 20) score += 2;
  if (scotland === "yes") score += 2;

  if (score >= 4) return "high";
  if (score >= 2) return "medium";
  return "low";
}

function addOperator() {

  let company = document.getElementById("company").value;
  let market = document.getElementById("market").value;
  let departures = parseInt(document.getElementById("departures").value) || 0;
  let scotland = document.getElementById("scotland").value;
  let contact = document.getElementById("contact").value;
  let email = document.getElementById("email").value;

  let priority = calculatePriority(departures, scotland);

  let newOperator = {
    company,
    market,
    departures,
    scotland,
    contact,
    email,
    priority,
    status: "Not Contacted"
  };

  operators.push(newOperator);
  localStorage.setItem("operators", JSON.stringify(operators));

  renderTable();
}

function renderTable() {

  let tableBody = document.getElementById("tableBody");
  tableBody.innerHTML = "";

  operators.forEach(op => {

    let badgeClass = op.priority;

    let row = `
      <tr>
        <td>${op.company}</td>
        <td>${op.market}</td>
        <td>${op.departures}</td>
        <td>${op.scotland}</td>
        <td><span class="badge ${badgeClass}">${op.priority.toUpperCase()}</span></td>
        <td>${op.status}</td>
      </tr>
    `;

    tableBody.innerHTML += row;

  });
}

renderTable();

</script>

</body>
</html>
