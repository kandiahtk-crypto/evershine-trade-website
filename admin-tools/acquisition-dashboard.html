<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Outbound Operator Acquisition System</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6fa;
  margin: 0;
  padding: 40px;
}

.container {
  max-width: 1100px;
  margin: auto;
  background: white;
  padding: 40px;
  border-radius: 12px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.05);
}

h1 {
  margin-top: 0;
}

label {
  display: block;
  margin-top: 20px;
  font-weight: bold;
}

input, select {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 6px;
  border: 1px solid #ddd;
}

button {
  margin-top: 25px;
  padding: 14px;
  width: 100%;
  background: #2e5fa7;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 40px;
}

th, td {
  padding: 14px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #f3f6fb;
}

.badge {
  padding: 6px 10px;
  border-radius: 20px;
  color: white;
  font-size: 12px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Outbound Operator Acquisition System</h1>

<h2>Add New Operator</h2>

<label>Company Name</label>
<input type="text" id="company">

<label>Country / Market</label>
<select id="market">
  <option>USA</option>
  <option>Europe</option>
  <option>China</option>
  <option>India</option>
</select>

<label>Estimated Annual UK Departures</label>
<input type="number" id="departures">

<label>Includes Scotland Routing?</label>
<select id="scotland">
  <option>Yes</option>
  <option>No</option>
</select>

<label>Estimated Average Programme Value (£)</label>
<input type="number" id="programmeValue">

<label>Status</label>
<select id="status">
  <option>New Lead</option>
  <option>Contacted</option>
  <option>Proposal Sent</option>
  <option>Negotiation</option>
  <option>Contracted</option>
</select>

<button onclick="addOperator()">Add Operator</button>

<h2>Pipeline</h2>

<table>
<thead>
<tr>
<th>Company</th>
<th>Market</th>
<th>Departures</th>
<th>Scotland</th>
<th>Est Revenue</th>
<th>Est Profit</th>
<th>Priority</th>
<th>Status</th>
</tr>
</thead>
<tbody id="pipelineTable"></tbody>
</table>

</div>

<script>

let operators = JSON.parse(localStorage.getItem("operators")) || [];

function addOperator() {

  const company = document.getElementById("company").value;
  const market = document.getElementById("market").value;
  const departures = parseInt(document.getElementById("departures").value) || 0;
  const scotland = document.getElementById("scotland").value;
  const programmeValue = parseFloat(document.getElementById("programmeValue").value) || 0;
  const status = document.getElementById("status").value;

  let score = 0;

  // Market weighting
  if (market === "USA") score += 3;
  if (market === "China") score += 3;
  if (market === "India") score += 2;
  if (market === "Europe") score += 2;

  // Volume weighting
  if (departures >= 20) score += 4;
  else if (departures >= 10) score += 2;
  else if (departures >= 5) score += 1;

  // Scotland = higher margin
  if (scotland === "Yes") score += 3;

  // Revenue projection
  let estimatedRevenue = departures * programmeValue;

  // Market margin floors
  let marginFloor = 0.25;
  if (market === "USA") marginFloor = 0.28;
  if (market === "China") marginFloor = 0.30;

  let estimatedProfit = estimatedRevenue * marginFloor;

  // Priority logic
  let priorityText = "";
  let priorityColor = "";

  if (score >= 8) {
    priorityText = "High";
    priorityColor = "red";
  } else if (score >= 5) {
    priorityText = "Medium";
    priorityColor = "orange";
  } else {
    priorityText = "Low";
    priorityColor = "green";
  }

  operators.push({
    company,
    market,
    departures,
    scotland,
    estimatedRevenue,
    estimatedProfit,
    priorityText,
    priorityColor,
    status
  });

  localStorage.setItem("operators", JSON.stringify(operators));

  renderPipeline();
}

function renderPipeline() {

  const table = document.getElementById("pipelineTable");
  table.innerHTML = "";

  operators.forEach(op => {
    table.innerHTML += `
      <tr>
        <td>${op.company}</td>
        <td>${op.market}</td>
        <td>${op.departures}</td>
        <td>${op.scotland}</td>
        <td>£${op.estimatedRevenue.toLocaleString()}</td>
        <td>£${op.estimatedProfit.toLocaleString()}</td>
        <td><span class="badge" style="background:${op.priorityColor}">
          ${op.priorityText}
        </span></td>
        <td>${op.status}</td>
      </tr>
    `;
  });
}

renderPipeline();

</script>

</body>
</html>
