<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UK Inbound Ground Transport | Trade Only</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- HEADER PLACEHOLDER -->
  <div id="site-header"></div>

  <!-- LOAD HEADER -->
<script>
  fetch("partials/header.html")
    .then(response => response.text())
    .then(html => {
      document.getElementById("site-header").innerHTML = html;
    })
    .catch(err => {
      console.error("Header failed to load", err);
    });
</script>
    

  <!-- MAIN CONTENT -->
  <main>
    <section class="container">
      <h1>UK Inbound Ground Transport for Tour Operators & DMCs</h1>

      <p>
        We provide pre-booked <strong>UK inbound ground transport</strong> for
        destination management companies and international tour operators,
        delivering structured, reliable coach operations across the United Kingdom.
      </p>
    </section>
  </main>

</body>
</html>
