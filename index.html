<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>UK Inbound Ground Transport | Trade Only</title>

  <!-- CSS -->
  <link rel="stylesheet" href="/evershine-trade-website/style.css" />
</head>

<body>

  <!-- HEADER PLACEHOLDER -->
  <div id="site-header"></div>

  <!-- LOAD HEADER -->
  <script>
    fetch("partials/header.html")
      .then(res => res.text())

  <!-- MAIN CONTENT -->
  <main>

      </p>

</body>
</html>
