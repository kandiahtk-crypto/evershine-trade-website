  <meta charset="UTF-8">

<body>

<nav>
  <div class="container">
    <strong>Inbound Ground Transport</strong>
    <a href="index.html">Home</a>
    <a href="services.html">Services</a>
    <a href="series-tours.html">Series Tours</a>

  </div>
</nav>

  <main class="container">

  <p class="label">Request for Quotation</p>
  <h1>Programme Submission</h1>

  <p>
    For DMCs and tour operators requiring structured UK
    ground transport delivery.
  </p>

  <form action="mailto:your@email.com" method="post" enctype="text/plain">

    <div class="section">
      <label>Company Name *</label><br>
      <input type="text" name="Company" required>
    </div>

    <div class="section">
      <label>Contact Name *</label><br>
      <input type="text" name="Contact" required>
    </div>

    <div class="section">
      <label>Email *</label><br>
      <input type="email" name="Email" required>
    </div>

    <div class="section">
      <label>Travel Dates</label><br>
      <input type="text" name="Dates">
    </div>

    <div class="section">
      <label>Group Size</label><br>
      <input type="text" name="Group Size">
    </div>

    <div class="section">
      <label>Programme Details *</label><br>
      <textarea name="Details" rows="6" required></textarea>
    </div>

    <div class="section">
      <button type="submit">Submit RFQ</button>
    </div>

  </form>

</main>


<footer>
  <div class="container">
    <p>Trade-only UK ground transport provider.</p>
  </div>
</footer>

</body>
</html>
